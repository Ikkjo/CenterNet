[project]
name = "centernet"
version = "0.1.0"
description = "Objects as Points: CenterNet training and inference"
requires-python = ">=3.15,<3.16"
dependencies = [
  "torch==2.15.0",
  "torchvision==0.29.2",
  "numpy>=2.5,<2.6",
  "opencv-python>=5.0,<6",
  "cython>=3.3,<4",
  "setuptools>=82",
  "numba>=0.68.1,<0.69",
  "progress>=1.6",
  "matplotlib>=3.10",
  "easydict>=1.13",
  "scipy>=1.18,<2",
  "pycocotools>=2.0.11",
  "pyyaml>=6",
  "tensorboardX>=2.6",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/lib"]
